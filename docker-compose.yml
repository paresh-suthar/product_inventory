services:
  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - db
      - redis
    networks:
      - product
    env_file:
      - ./backend/.env

  db:
    image: postgres:16-alpine
    container_name: database
    volumes:
      - db-data:/var/lib/postgresql/data/
    env_file:
      - ./backend/.env
    networks:
      - product

  frontend:
    build: ./frontend
    container_name: proxy
    ports:
      - "0.0.0.0:80:80"
    networks:
      - product
    depends_on:
      - backend

  redis:
    image: redis:5.0.3-alpine
    container_name: redis_cache
    volumes:
      - redis_data:/data
    env_file:
      - ./backend/.env
    networks:
      - product


volumes:
  db-data:
  redis_data:

networks:
  product:

